name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build+scan+sign against a throwaway :provenance-test tag; do not cut a release"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  packages: write        # push images + attestations to GHCR
  attestations: write    # actions/attest-* write to the attestations store
  # id-token: write is granted only to the jobs that sign or attest.

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # The macOS signing and notary secrets live in the "release" environment,
    # which only main can deploy to, so a workflow run from any other branch
    # reads them as empty (docs/contributing/macos-signing.md).
    environment: release
    # Signs (cosign) and attests (actions/attest-*), so it can mint an OIDC
    # token. A job-level block replaces the workflow-level one, so the rest
    # is repeated unchanged.
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write        # keyless cosign / OIDC
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Trivy
        # Trivy is not preinstalled on ubuntu-latest; hack/scan-images.sh calls
        # the bare `trivy` CLI. Pinned by version and SHA-256 in
        # hack/install-pinned-tool.sh. This job holds the signing material,
        # so a download that does not match the pin fails the step and is
        # never run.
        run: |
          ./hack/install-pinned-tool.sh trivy "$RUNNER_TEMP/trivy"
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"

      - name: Install crane
        # Reads the pushed image digests for the sign and attest steps.
        # Pinned like Trivy, and installed here so a failed download or a pin
        # mismatch fails the job before GoReleaser publishes anything.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          ./hack/install-pinned-tool.sh crane "$RUNNER_TEMP/crane"
          echo "$RUNNER_TEMP/crane" >> "$GITHUB_PATH"

      - name: Scan images before push (Trivy, amd64)
        run: ./hack/scan-images.sh
        env:
          VERSION: ${{ needs.release-please.outputs.version || github.sha }}

      - name: Install rcodesign
        # hack/macos-sign.sh, the GoReleaser post-build hook for the darwin
        # binaries, signs them with rcodesign, which runs on Linux. Pinned by
        # version and SHA-256 in hack/install-rcodesign.sh: a mismatch fails
        # the release, while a failed download only warns (the hook then
        # fails if signing is configured).
        if: ${{ github.event_name == 'push' }}
        run: |
          ./hack/install-rcodesign.sh "$RUNNER_TEMP/rcodesign"
          echo "$RUNNER_TEMP/rcodesign" >> "$GITHUB_PATH"

      - name: Check macOS signing and notarization settings
        # The notarize-macos job runs after the release is published, so a
        # notary misconfiguration has to fail here, before anything is. With
        # no signing secrets set this passes and the darwin binaries are
        # ad-hoc signed.
        if: ${{ github.event_name == 'push' }}
        env:
          MACOS_SIGNING_REQUIRED: ${{ vars.MACOS_SIGNING_REQUIRED }}
          MACOS_SIGN_P12_SET: ${{ secrets.MACOS_SIGN_P12 != '' }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: ./hack/macos-notarize.sh --preflight >/dev/null

      - name: Run GoReleaser
        if: ${{ github.event_name == 'push' }}
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: 'v2.19.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read by hack/macos-sign.sh (docs/contributing/macos-signing.md).
          # Unset: the darwin binaries are ad-hoc signed. A .p12 without its
          # password fails the release, and so does a missing .p12 once the
          # repository variable MACOS_SIGNING_REQUIRED is true. The notary
          # key is not needed here: the notarize-macos job submits the
          # binaries after the release.
          MACOS_SIGNING_REQUIRED: ${{ vars.MACOS_SIGNING_REQUIRED }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}

      - name: Upload artifacts
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist/*

      - name: Install cosign
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      # Full sha256:... digests per image, captured once so every sign/attest/
      # verify step below references the exact bytes GoReleaser pushed.
      - name: Capture image digests
        if: ${{ github.event_name == 'push' }}
        id: digests
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          for id in operator agent; do
            d="$(crane digest "ghcr.io/defilantech/meitheal-${id}:${VERSION}")"
            echo "${id}=${d}" >> "$GITHUB_OUTPUT"
          done

      - name: Sign images
        if: ${{ github.event_name == 'push' }}
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/defilantech/meitheal-operator@${{ steps.digests.outputs.operator }}"
          cosign sign --yes "ghcr.io/defilantech/meitheal-agent@${{ steps.digests.outputs.agent }}"

      - name: Generate SBOM (operator)
        if: ${{ github.event_name == 'push' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ghcr.io/defilantech/meitheal-operator@${{ steps.digests.outputs.operator }}
          format: spdx-json
          output-file: sbom-operator.spdx.json

      - name: Attest SBOM (operator)
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/defilantech/meitheal-operator
          subject-digest: ${{ steps.digests.outputs.operator }}
          sbom-path: sbom-operator.spdx.json
          push-to-registry: true

      - name: Attest provenance (operator)
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/defilantech/meitheal-operator
          subject-digest: ${{ steps.digests.outputs.operator }}
          push-to-registry: true

      - name: Generate SBOM (agent)
        if: ${{ github.event_name == 'push' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ghcr.io/defilantech/meitheal-agent@${{ steps.digests.outputs.agent }}
          format: spdx-json
          output-file: sbom-agent.spdx.json

      - name: Attest SBOM (agent)
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/defilantech/meitheal-agent
          subject-digest: ${{ steps.digests.outputs.agent }}
          sbom-path: sbom-agent.spdx.json
          push-to-registry: true

      - name: Attest provenance (agent)
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/defilantech/meitheal-agent
          subject-digest: ${{ steps.digests.outputs.agent }}
          push-to-registry: true

      - name: Verify signatures + attestations
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # github.repository preserves the real case, and GitHub OIDC's
          # workflow_ref does too, so match the identity against it as is.
          id_re="^${{ github.server_url }}/${{ github.repository }}/\.github/workflows/release-please\.yml@.*$"
          iss=https://token.actions.githubusercontent.com
          owner="${{ github.repository_owner }}"
          for ref in \
            "ghcr.io/defilantech/meitheal-operator@${{ steps.digests.outputs.operator }}" \
            "ghcr.io/defilantech/meitheal-agent@${{ steps.digests.outputs.agent }}"; do
            cosign verify "$ref" --certificate-identity-regexp "$id_re" --certificate-oidc-issuer "$iss"
            # actions/attest-build-provenance and actions/attest-sbom write to
            # the GitHub attestations store, so `gh attestation verify` is the
            # verifier for both.
            gh attestation verify "oci://${ref}" --owner "$owner"
            gh attestation verify "oci://${ref}" --owner "$owner" \
              --predicate-type https://spdx.dev/Document/v2.3
          done

      - name: Attest release binary provenance
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Dry-run build + sign + verify (workflow_dispatch)
        # Exercises the scan -> push -> sign -> verify chain without cutting a
        # release: builds only the operator image for amd64, staged the same
        # way hack/scan-images.sh stages it, then pushes it to a throwaway
        # :provenance-test tag under the running repo's own GHCR namespace
        # (lowercased: GHCR rejects uppercase), so this works unmodified on a
        # fork.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          img="ghcr.io/${owner_lc}/meitheal-operator"
          ctx="$(mktemp -d)"
          mkdir -p "$ctx/linux/amd64"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o "$ctx/linux/amd64/meitheal-operator" ./cmd/meitheal-operator
          # The image COPYs the third-party license tree the GoReleaser
          # context stages; stage the same paths here.
          make third-party-licenses
          cp LICENSE "$ctx/LICENSE"
          cp -R third_party_licenses "$ctx/third_party_licenses"
          docker buildx build --platform linux/amd64 --push \
            -f Dockerfile.operator.goreleaser -t "${img}:provenance-test" "$ctx"
          digest="$(crane digest "${img}:provenance-test")"
          cosign sign --yes "${img}@${digest}"
          id_re="^${{ github.server_url }}/${{ github.repository }}/\.github/workflows/release-please\.yml@.*$"
          cosign verify "${img}@${digest}" \
            --certificate-identity-regexp "$id_re" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  coder-image:
    # The coder-Job image (Dockerfile.agent-builder): the meitheal-agent
    # binary plus the go/make/git/helm/golangci-lint/controller-gen toolchain
    # the coder's gate checks run. GoReleaser stages prebuilt binaries, and
    # this image compiles its own and installs tools, so it builds here with
    # buildx and gets the same signature and attestations as the others.
    needs: [release-please, goreleaser]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless cosign / OIDC
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the coder image
        id: build
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          image=ghcr.io/defilantech/meitheal-agent-coder
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -f Dockerfile.agent-builder \
            --label org.opencontainers.image.title=meitheal-agent-coder \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --metadata-file "$RUNNER_TEMP/coder-metadata.json" \
            -t "${image}:${VERSION}" .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/coder-metadata.json")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Sign the coder image
        env:
          COSIGN_YES: "true"
        run: cosign sign --yes "ghcr.io/defilantech/meitheal-agent-coder@${{ steps.build.outputs.digest }}"

      - name: Generate SBOM (agent-coder)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ghcr.io/defilantech/meitheal-agent-coder@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-agent-coder.spdx.json

      - name: Attest SBOM (agent-coder)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/defilantech/meitheal-agent-coder
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-agent-coder.spdx.json
          push-to-registry: true

      - name: Attest provenance (agent-coder)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/defilantech/meitheal-agent-coder
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  notarize-macos:
    # Submits every darwin binary of the release to Apple's notary service in
    # one submission (hack/macos-notarize.sh). It runs after the release is
    # published because notarization does not change the binaries: the
    # published assets become notarized when Apple accepts them. A slow queue
    # or a transient failure fails only this job, and "Re-run failed jobs"
    # resubmits without rebuilding anything. Without the notary secrets the
    # preflight reports false and every later step is skipped.
    needs: [release-please, goreleaser]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      MACOS_SIGNING_REQUIRED: ${{ vars.MACOS_SIGNING_REQUIRED }}
      MACOS_SIGN_P12_SET: ${{ secrets.MACOS_SIGN_P12 != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whether to notarize
        id: check
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        # An assignment, not echo "$(...)", so a failed check fails the step.
        run: |
          notarize="$(./hack/macos-notarize.sh --preflight)"
          echo "notarize=${notarize}" >> "$GITHUB_OUTPUT"

      - name: Download the release's binaries
        if: ${{ steps.check.outputs.notarize == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist

      - name: Install rcodesign
        if: ${{ steps.check.outputs.notarize == 'true' }}
        run: |
          ./hack/install-rcodesign.sh "$RUNNER_TEMP/rcodesign"
          echo "$RUNNER_TEMP/rcodesign" >> "$GITHUB_PATH"

      - name: Notarize the darwin binaries
        if: ${{ steps.check.outputs.notarize == 'true' }}
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: ./hack/macos-notarize.sh dist/artifacts.json

  release-helm:
    # After goreleaser, not beside it: every image the chart uses by default
    # comes from goreleaser, so a chart published first points at images that
    # do not exist yet. A failed build also leaves the chart unpublished.
    needs: [release-please, goreleaser]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Sync Chart CRDs Before Packaging
        run: make chart-crds

      - name: Log in to GHCR for Helm OCI
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Package and push the chart to GHCR (OCI)
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          OCI_REPO: oci://ghcr.io/defilantech/charts
        run: |
          helm package charts/meitheal --destination dist-charts
          helm push "dist-charts/meitheal-${VERSION}.tgz" "$OCI_REPO"
