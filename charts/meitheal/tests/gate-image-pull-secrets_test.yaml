suite: gate Job image pull secrets (#46)
templates:
  - agent-deployment.yaml

tests:
  - it: chart imagePullSecrets reach the agent as --gate-image-pull-secrets
    template: agent-deployment.yaml
    set:
      agent.enabled: true
      imagePullSecrets:
        - name: registry-cred
        - name: ghcr-pull
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --gate-image-pull-secrets=registry-cred,ghcr-pull

  - it: no imagePullSecrets renders no --gate-image-pull-secrets
    template: agent-deployment.yaml
    set:
      agent.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args[?(@ =~ /^--gate-image-pull-secrets/)]

  - it: every agent pool gets --gate-image-pull-secrets
    template: agent-deployment.yaml
    values:
      - ./values-multi.yaml
    set:
      imagePullSecrets:
        - name: registry-cred
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-meitheal-llmkube-fork-agent
      matchMany: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --gate-image-pull-secrets=registry-cred

  - it: the agent pod keeps its own imagePullSecrets
    template: agent-deployment.yaml
    set:
      agent.enabled: true
      imagePullSecrets:
        - name: registry-cred
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: registry-cred
