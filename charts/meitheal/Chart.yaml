apiVersion: v2
name: meitheal
description: |
  Meitheal schedules agentic coding workloads (Workload, AgenticTask)
  across a fleet of nodes (FleetNode) that run coder, verifier and
  reviewer agents on local models. An Agent's model can be an
  InferenceService served by LLMKube or any OpenAI-compatible endpoint.
  When Agents use LLMKube InferenceServices, install LLMKube's own chart
  first; the meitheal-operator's RBAC reads the inference.llmkube.dev
  CRDs that chart installs. The two charts share no Helm relationship.
type: application
version: 0.1.2
appVersion: 0.1.2
keywords:
  - meitheal
  - agentic
  - workload
  - orchestration
  - llm
home: https://github.com/defilantech/meitheal
sources:
  - https://github.com/defilantech/meitheal
